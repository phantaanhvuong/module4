<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Management</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        input, textarea, select {
            width: 100%;
            max-width: 500px;
            padding: 8px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 8px 16px;
            margin: 10px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        .btn-edit {
            background-color: #f39c12;
        }

        .btn-edit:hover {
            background-color: #e67e22;
        }

        .btn-delete {
            background-color: #e74c3c;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        #btn-more {
            display: block;
            margin: 20px auto;
            background-color: #2ecc71;
        }

        #btn-more:hover {
            background-color: #27ae60;
        }

        div {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>

</head>
<body>
<h1>Quản lý Blog</h1>

<div>
    <input id="tieuDe" placeholder="Tiêu đề"><br>
    <textarea id="tomTatNoiDung" placeholder="Tóm tắt nội dung"></textarea><br>
    <textarea id="noiDungChiTiet" placeholder="Nội dung chi tiết"></textarea><br>

    <select id="categoryId">
        <option value="1">Cuộc sống</option>
        <option value="2">Du lịch</option>
        <option value="3">lập trình</option>
    </select><br>
    <button id="btn-save">Lưu</button>
</div>
<div style="margin-top: 20px;">
    <input id="searchInput" placeholder="Nhập tiêu đề hoặc thể loại để tìm..." style="width: 300px; padding: 8px;">
    <select id="searchCategory" style="width: 180px; padding: 8px;">
        <option value="">-- Chọn thể loại --</option>
    </select>
    <button id="btn-search">Tìm kiếm</button>
    <button id="btn-reset">Hiển thị tất cả</button>
</div>


<table border="1">
    <thead>
    <tr>
        <th>STT</th>
        <th>ID</th>
        <th>Tiêu đề</th>
        <th>Nội dung</th>
        <th>Thể loại</th>
        <th>Chỉnh sửa</th>
        <th>Xoá</th>
    </tr>
    </thead>
    <tbody id="blog-content"></tbody>
</table>

<button id="btn-more">Xem thêm</button>

<script>
    let page = 0;
    const size = 3;


    function displayAppend(pageNumber) {
        $.ajax({
            url: `http://localhost:8080/api/v1/blogs/load?page=${pageNumber}&size=${size}`,
            method: 'GET',
            success: function (data) {
                let html = '';
                for (let i = 0; i < data.length; i++) {
                    html += `
          <tr>
              <td>${(pageNumber * size) + i + 1}</td>
              <td>${data[i].id}</td>
              <td>${data[i].tieuDe}</td>
              <td>${data[i].tomTatNoiDung}</td>
              <td>${data[i].category.name}</td>
              <td><button class="btn-edit" data-id="${data[i].id}">Sửa</button></td>
              <td><button class="btn-delete" data-id="${data[i].id}">Xoá</button></td>
          </tr>`;
                }
                $('#blog-content').append(html);
            },
            error: function (xhr) {
                console.log("Lỗi khi load dữ liệu:", xhr.status, xhr.responseText);
            }
        });
    }


    function displayReset() {
        page = 0;
        $('#blog-content').html('');
        displayAppend(page);
    }

    $(document).ready(function () {
        displayAppend(page);
        //ajax tim kiếm
        $.ajax({
            url: 'http://localhost:8080/api/v1/category',
            method: 'GET',
            success: function (data) {
                data.forEach(function (category) {
                    $('#searchCategory').append(`<option value="${category.id}">${category.name}</option>`);
                });
            },
            error: function () {
                alert("Không thể tải danh sách thể loại tìm kiếm.");
            }
        });


    });

        //hiển thị + phân trang
    $('#btn-more').click(function () {
        page++;
        displayAppend(page);
    });

        $('#btn-save').click(function () {
            const blog = {
                tieuDe: $('#tieuDe').val(),
                tomTatNoiDung: $('#tomTatNoiDung').val(),
                noiDungChiTiet: $('#noiDungChiTiet').val(),
                category: {
                    id: $('#categoryId').val()
                }
            };
            const id = $('#btn-save').data('edit-id');
            const url = id
                ? `http://localhost:8080/api/v1/blogs/${id}`
                : 'http://localhost:8080/api/v1/blogs';
            const method = id ? 'PATCH' : 'POST';

            $.ajax({
                url: url,
                method: method,
                contentType: 'application/json',
                data: JSON.stringify(blog),
                success: function () {

                    $('#blog-content').html('');
                    page = 0;
                    displayAppend(page);
                    $('#tieuDe').val('');
                    $('#tomTatNoiDung').val('');
                    $('#noiDungChiTiet').val('');
                    $('#categoryId').val('1');
                    $('#btn-save').removeData('edit-id');
                },
                error: function () {
                    alert("Lỗi khi lưu blog.");
                }
            });


    });
    //xoá

    $(document).on('click', '.btn-delete', function () {
        const id = $(this).data('id');
        if (confirm("Bạn có chắc muốn xoá?")) {
            $.ajax({
                url: `http://localhost:8080/api/v1/blogs/${id}`,
                method: 'DELETE',
                success: function () {
                    displayReset();
                },
                error: function () {
                    alert("Lỗi khi xoá blog");
                }
            });
        }
    });

    // chỉnh sửa
    $(document).on('click', '.btn-edit', function () {
        const id = $(this).data('id');
        $.ajax({
            url: `http://localhost:8080/api/v1/blogs/${id}`,
            method: 'GET',
            success: function (data) {
                $('#tieuDe').val(data.tieuDe);
                $('#tomTatNoiDung').val(data.tomTatNoiDung);
                $('#noiDungChiTiet').val(data.noiDungChiTiet);
                $('#categoryId').val(data.category.id);
                $('#btn-save').data('edit-id', data.id);
            },
            error: function () {
                alert("Không tìm thấy blog");
            }
        });
    });
    // tìm kiếm

    $('#btn-search').click(function () {
        const keyword = $('#searchInput').val().trim();
        const categoryId = $('#searchCategory').val();

        // Nếu có từ khóa tìm theo tiêu đề
        if (keyword !== '') {
            $.ajax({
                url: `http://localhost:8080/api/v1/blogs/search?keyword=${encodeURIComponent(keyword)}`,
                method: 'GET',
                success: function (data) {
                    showSearchResults(data);
                },
                error: function () {
                    alert("Lỗi khi tìm theo tiêu đề.");
                }
            });
            return;
        }

        // Nếu có chọn thể loại
        if (categoryId) {
            $.ajax({
                url: `http://localhost:8080/api/v1/category/${categoryId}/blogs`,
                method: 'GET',
                success: function (data) {
                    showSearchResults(data);
                },
                error: function () {
                    alert("Lỗi khi tìm theo thể loại.");
                }
            });
            return;
        }

        alert("Vui lòng nhập từ khoá hoặc chọn thể loại để tìm.");
    });

    function showSearchResults(data) {
        $('#blog-content').html('');
        page = 0;
        let html = '';
        for (let i = 0; i < data.length; i++) {
            html += `
            <tr>
                <td>${i + 1}</td>
                <td>${data[i].id}</td>
                <td>${data[i].tieuDe}</td>
                <td>${data[i].tomTatNoiDung}</td>
                <td>${data[i].category.name}</td>
                <td><button class="btn-edit" data-id="${data[i].id}">Sửa</button></td>
                <td><button class="btn-delete" data-id="${data[i].id}">Xoá</button></td>
            </tr>`;
        }
        $('#blog-content').html(html);
    }

    $('#btn-reset').click(function () {
        displayReset();
    });
</script>


</body>
</html>
