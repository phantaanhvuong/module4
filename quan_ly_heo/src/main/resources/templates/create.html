<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Create Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 3rem auto;
        }

        .card {
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        .card h3 {
            color: #0d6efd;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        label.form-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .form-control {
            border-radius: 6px;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.2);
        }

        .form-actions {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .btn-primary,
        .btn-secondary {
            border-radius: 6px;
            padding: 10px 24px;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }

        .btn-secondary:hover {
            background-color: #6c757d;
            border-color: #5c636a;
        }

        .text-danger {
            font-size: 0.875rem;
            margin-top: -0.5rem;
            display: block;
        }

        .mb-3 {
            margin-bottom: 1.5rem !important;
        }

        .btn-back {
            margin-bottom: 1rem;
            display: inline-block;
        }
        /* Highlight input khi có lỗi */
        .form-control.is-invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220,53,69,.1);
        }

        .invalid-feedback {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.4rem;
            margin-left: 2px;
            display: block;
            font-style: italic;
        }


    </style>


</head>
<body>
<!--<div th:replace="fragments/header :: navbar"></div>-->
<div class="container">
    <div class="card">
        <h3>Thêm mới sản phẩm</h3>

        <form th:action="@{/products/save}" th:object="${product}" method="POST" novalidate="novalidate">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label for="productCode" class="form-label">Mã sản phẩm</label>
                <input type="text" id="productCode" th:field="*{productCode}"  th:class="${#fields.hasErrors('productCode')} ? 'form-control is-invalid' : 'form-control'"  placeholder="Nhập mã sản phẩm"/>
                <span th:if="${#fields.hasErrors('productCode')}" th:errors="*{productCode}" class="invalid-feedback"></span>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Tên sản phẩm</label>
                <input type="text" id="name" th:field="*{name}"  th:class="${#fields.hasErrors('name')} ? 'form-control is-invalid' : 'form-control'"  placeholder="Nhập tên sản phẩm"/>
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"></span>
            </div>

            <div class="mb-3">
                <label for="describe" class="form-label">Mô tả sản phẩm</label>
                <input type="text" id="describe" th:field="*{describe}" th:class="${#fields.hasErrors('describe')} ? 'form-control is-invalid' : 'form-control'" placeholder="Nhập mô tả sản phẩm"/>
                <span th:if="${#fields.hasErrors('describe')}" th:errors="*{describe}" class="invalid-feedback"></span>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Giá sản phẩm </label>
                <input type="number" id="price" th:field="*{price}" th:class="${#fields.hasErrors('price')} ? 'form-control is-invalid' : 'form-control'" placeholder="Nhập giá sản phẩm" />
<!--                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="invalid-feedback"></span>-->
            </div>
            <div class="mb-3">
                <label for="xuatXu" class="form-label">Vị trí</label>
                <select id="xuatXu" class="form-control" th:field="*{type}">
                    <option th:each="c:${typeList}"
                            th:value="${c.id}" th:text="${c.name}">
                    </option>
                </select>
            </div>
            <div class="form-actions">
                <input type="submit" value="Lưu" class="btn btn-primary"/>
                <a th:href="@{/products}" class="btn btn-secondary">Quay lại</a>
            </div>
        </form>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
