<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Edit Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 2rem;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        .form-label {
            font-weight: 500;
            color: #333;
        }
        .form-control {
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        .btn-primary {
            border-radius: 5px;
            padding: 8px 20px;
        }
        .btn-secondary {
            border-radius: 5px;
            padding: 8px 20px;
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        h3 {
            color: #007bff;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h3>Chỉnh sửa cầu thủ</h3>
        <form th:action="@{'/products/' + ${product.id} + '/edit'}" th:object="${product}" method="POST" novalidate="novalidate">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label for="productCode" class="form-label">Mã sản phẩm</label>
                <input type="text" id="productCode" th:field="*{productCode}"  th:class="${#fields.hasErrors('productCode')} ? 'form-control is-invalid' : 'form-control'"  placeholder="Nhập mã sản phẩm"/>
                <span th:if="${#fields.hasErrors('productCode')}" th:errors="*{productCode}" class="invalid-feedback"></span>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Tên sản phẩm</label>
                <input type="text" id="name" th:field="*{name}"  th:class="${#fields.hasErrors('name')} ? 'form-control is-invalid' : 'form-control'"  placeholder="Nhập tên sản phẩm"/>
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"></span>
            </div>

            <div class="mb-3">
                <label for="describe" class="form-label">Mô tả sản phẩm</label>
                <input type="text" id="describe" th:field="*{describe}" th:class="${#fields.hasErrors('describe')} ? 'form-control is-invalid' : 'form-control'" placeholder="Nhập mô tả sản phẩm"/>
                <span th:if="${#fields.hasErrors('describe')}" th:errors="*{describe}" class="invalid-feedback"></span>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Giá sản phẩm </label>
                <input type="number" id="price" th:field="*{price}" th:class="${#fields.hasErrors('price')} ? 'form-control is-invalid' : 'form-control'" placeholder="Nhập giá sản phẩm" />
                <!--                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="invalid-feedback"></span>-->
            </div>
            <div class="mb-3">
                <label for="xuatXu" class="form-label">Vị trí</label>
                <select id="xuatXu" class="form-control" th:field="*{type}">
                    <option th:each="c:${typeList}"
                            th:value="${c.id}" th:text="${c.name}">
                    </option>
                </select>
            </div>
            <div class="form-actions">
                <input type="submit" value="Lưu" class="btn btn-primary"/>
                <a th:href="@{/products}" class="btn btn-secondary">Quay lại</a>
            </div>
        </form>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
