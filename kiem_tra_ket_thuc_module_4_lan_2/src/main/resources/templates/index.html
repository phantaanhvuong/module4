<!DOCTYPE html>

<head>
  <title>List Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin-top: 2rem;
    }

    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .table {
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    .table th {
      background-color: #007bff;
      color: white;
      border: none;
    }

    .table td {
      vertical-align: middle;
    }

    .btn-primary {
      border-radius: 5px;
      padding: 8px 20px;
    }

    .btn-danger {
      border-radius: 5px;
      padding: 8px 20px;
    }

    .btn-sm {
      padding: 5px 10px;
    }

    .search-form {
      max-width: 500px;
      margin-bottom: 1.5rem;
    }

    .search-form input {
      border-radius: 5px 0 0 5px;
    }

    .search-form button {
      border-radius: 0 5px 5px 0;
    }

    .notify {
      margin-top: 1rem;
    }

    .notify .alert {
      border-radius: 5px;
    }

    .action-links a {
      margin-right: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="notify">
    <div th:if="${success}" class="alert alert-success" role="alert"  id="successAlert">
      <span th:text="${success}"></span>
    </div>
  </div>


  <div class="table-responsive">
    <table class="table table-hover" id="player">
      <thead>
      <tr>
        <th>Mã đơn hàng</th>
        <th>Tên sản phẩm</th>
        <th>Giá</th>
        <th>Loại sản phẩm</th>
        <th>Ngày mua</th>
        <th>Số lượng</th>
        <th>Tổng tiền</th>
        <th>Hành động</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row,rowStat : ${donHangPage}">
        <td th:text="${row.maDonHang}"></td>
        <td th:text="${row.products.name}"></td>
        <td th:text="${row.products.gia}"></td>
        <td th:text="${row.products.loaiSanPham.name}"></td>
        <td th:text="${row.ngayMua}"></td>
        <td th:text="${row.soLuong}"></td>
        <td th:text="${row.products.gia*row.soLuong}"><span></span></td>
        <td>
          <a th:href="@{/don_hang/{id}/edit(id=${row.id})}" class="btn btn-sm btn-outline-primary">sửa</a>
        </td>
      </tr>


      </tbody>
    </table>
  </div>

  <div class="col-12" th:if="${donHangPage.totalPages==0}">
    <div class="alert alert-info">Danh sách trống</div>
  </div>

<script>
  window.addEventListener('DOMContentLoaded', function () {
    const successAlert = document.getElementById('successAlert');
    if (successAlert) {
      setTimeout(() => {
        successAlert.classList.add('fade');
        successAlert.classList.remove('show');
        successAlert.style.display = 'none';
      }, 3000);
    }
  });
</script>

<div class="d-flex justify-content-center align-items-center mt-4">
  <a th:if="${donHangPage.hasPrevious()}"
     th:href="@{/don_hang(page=${donHangPage.number -1})}"
     class="btn btn-outline-secondary me-2">Trước</a>
  <span class="me-2">Trang <span th:text="${donHangPage.number +1}"></span> /
    <span th:text="${donHangPage.totalPages}"></span></span>
  <a th:if="${donHangPage.hasNext()}"
     th:href="@{/don_hang(page=${donHangPage.number +1})}"
     class="btn btn-outline-secondary">Sau</a>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
