<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Edit Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 2rem;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        .form-label {
            font-weight: 500;
            color: #333;
        }
        .form-control {
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        .btn-primary {
            border-radius: 5px;
            padding: 8px 20px;
        }
        .btn-secondary {
            border-radius: 5px;
            padding: 8px 20px;
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        h3 {
            color: #007bff;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">

        <form th:action="@{'/don_hang/' + ${donHang.id} + '/edit'}" th:object="${donHang}" method="POST" novalidate="novalidate">
            <input type="hidden" th:field="*{id}"/>
            <h3>Chỉnh sửa đơn hàng</h3>
            <div class="mb-3">
                <label for="maDonHang" class="form-label">mã đơn hàng</label>
                <input type="text" id="maDonHang" th:field="*{maDonHang}"  th:class="${#fields.hasErrors('maDonHang')} ? 'form-control is-invalid' : 'form-control'"  placeholder="Nhập mã đơn hàng"/>
                <!--                <span th:if="${#fields.hasErrors('products.name')}" th:errors="*{products.name}" class="invalid-feedback"></span>-->
            </div>
            <div class="mb-3">
                <label for="products.name" class="form-label">sản phẩm</label>
                <input type="text" id="products.name" th:field="*{products.name}"  th:class="${#fields.hasErrors('products.name')} ? 'form-control is-invalid' : 'form-control'"  placeholder="Nhập tên sản phẩm"/>
<!--                <span th:if="${#fields.hasErrors('products.name')}" th:errors="*{products.name}" class="invalid-feedback"></span>-->
            </div>


            <div class="mb-3">
                <label for="ngayMua" class="form-label">Ngày mua</label>
                <input type="date" id="ngayMua" th:field="*{ngayMua}" th:class="${#fields.hasErrors('ngayMua')} ? 'form-control is-invalid' : 'form-control'" placeholder="Nhập ngày mua"/>
<!--                <span th:if="${#fields.hasErrors('ngayMua')}" th:errors="*{ngayMua}" class="invalid-feedback"></span>-->
            </div>

            <div class="mb-3">
                <label for="soLuong" class="form-label">Số lượng</label>
                <input type="number" id="soLuong" th:field="*{soLuong}" th:class="${#fields.hasErrors('soLuong')} ? 'form-control is-invalid' : 'form-control'" placeholder="Nhập số lượng sản phẩm" />
                <!--                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="invalid-feedback"></span>-->
            </div>
            <div class="mb-3">
                <label for="xuatXu" class="form-label">Loại Sản phẩm</label>
                <select id="xuatXu" class="form-control" th:field="*{products.loaiSanPham}">
                    <option th:each="c:${typeList}"
                            th:value="${c.id}" th:text="${c.name}">
                    </option>
                </select>
            </div>
            <div class="form-actions">
                <input type="submit" value="Lưu" class="btn btn-primary"/>
                <a th:href="@{/don_hang}" class="btn btn-secondary">Quay lại</a>
            </div>
        </form>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
