<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="/layout :: head">
  <meta charset="UTF-8">
  <title>ListCustomer</title>
</head>
<body>
<h3>Product</h3>
<p>
  <a th:href="@{products/create}">
    Add new customer
  </a>
</p>
<table id="products">
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Nơi sản xuất</th>
    <th>Giá</th>
    <th>Edit</th>
    <th>Delete</th>
    <th>View</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="row,rowStat : ${products}">
    <td th:text="${row.getName()}"></td>
    <td th:text="${row.getNoiSanXuat()}"></td>
    <td th:text="${row.getGia()()}"></td>
    <td><a th:href="@{/products/{id}/edit(id=${row.getId()})}">edit</a></td>
    <td><a th:href="@{/products/{id}/delete(id=${row.getId()})}">delete</a></td>
    <td><a th:href="@{/products/{id}/view(id=${row.getId()})}">view</a></td>
  </tr>
  </tbody>
</table>
<footer th:replace="/layout :: footer"></footer>
<div class="notify">
  <div th:if="${success}">
    <span th:text="${success}"></span>
  </div>
</div>
</body>
</html>
